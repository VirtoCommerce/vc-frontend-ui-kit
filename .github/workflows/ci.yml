name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Locales
        run: yarn check-locales

      - name: Types
        run: yarn validate:types

      - name: Unit tests
        run: yarn test:unit run

      - name: Pack
        run: node scripts/pack.mjs

      # Installs the tarball into a clean Vite + Vue app, type-checks and builds it.
      - name: Smoke test
        run: node scripts/smoke.mjs
